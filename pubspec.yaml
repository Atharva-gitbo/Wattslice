name: wattslice
description: A modern Flutter app for scheduling smart appliances to save energy.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  mqtt_client: ^10.5.1
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  intl: ^0.19.0 # For date and currency formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
